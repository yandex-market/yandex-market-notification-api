description: "Уведомление о создании нового ответа на вопрос.\n\n`notificationType` = `QUESTION_ANSWER_CREATED`\n\n{% note tip \"Чтобы получить подробную информацию об ответе на вопрос\" %}\n\nИспользуйте метод [POST\_v1/businesses/{businessId}/goods-questions/answers](../../reference/goods-questions/getGoodsQuestionAnswers.md), где укажите его идентификатор в параметре `answerIds`.\n\n{% endnote %}\n"
type: object
required:
  - notificationType
  - answerId
  - businessId
  - createdAt
properties:
  notificationType:
    $ref: ./NotificationType.yaml
  answerId:
    description: Идентификатор ответа.
    type: integer
    format: int64
  businessId:
    $ref: ./BusinessId.yaml
  createdAt:
    description: >
      Дата и время создания ответа.


      Формат даты: ISO 8601 со смещением относительно UTC. Например,
      `2017-11-21T00:00:00.213Z`.
    type: string
    format: date-time
