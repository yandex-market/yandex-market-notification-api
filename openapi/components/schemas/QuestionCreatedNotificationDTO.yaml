description: "Уведомление о создании нового вопроса.\n\n`notificationType` = `QUESTION_CREATED`\n\n{% note tip \"Чтобы получить подробную информацию о вопросе\" %}\n\nИспользуйте метод [POST\_v1/businesses/{businessId}/goods-questions](../../reference/goods-questions/getGoodsQuestions.md), где укажите его идентификатор в параметре `questionIds`.\n\n{% endnote %}\n"
type: object
required:
  - notificationType
  - questionId
  - businessId
  - createdAt
properties:
  notificationType:
    $ref: ./NotificationType.yaml
  questionId:
    description: Идентификатор вопроса.
    type: integer
    format: int64
  businessId:
    $ref: ./BusinessId.yaml
  createdAt:
    description: >
      Дата и время создания вопроса.


      Формат даты: ISO 8601 со смещением относительно UTC. Например,
      `2017-11-21T00:00:00.213Z`.
    type: string
    format: date-time
